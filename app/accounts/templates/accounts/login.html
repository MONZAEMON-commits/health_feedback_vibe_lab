<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>
    <style>
        :root {
            --bg: #efe3c9;
            --text: #2b2020;
            --muted: #6f6155;
            --input-bg: #ececec;
            --input-border: #d8d0c8;
            --btn: #ff6a3d;
            --btn-hover: #f05f34;
            --error-bg: #fff0ec;
            --error-border: #ffc7b8;
            --error-text: #a3402a;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            font-family: "Yu Gothic UI", "Meiryo", sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            left: -120px;
            top: -110px;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: #f3c75f;
            opacity: 0.9;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            right: -70px;
            top: 24px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f3c75f;
            opacity: 0.85;
            z-index: 0;
            box-shadow: 0 -240px 0 -38px rgba(243, 199, 95, 0.88);
        }

        .layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .wave-left,
        .wave-right {
            position: absolute;
            bottom: -110px;
            width: 48vw;
            min-width: 360px;
            height: 360px;
            border-radius: 54% 46% 0 0 / 32% 28% 0 0;
            background: #f1c8a0;
        }

        .wave-left { left: -80px; }
        .wave-right { right: -80px; }

        .wave-left::before,
        .wave-right::before {
            content: "";
            position: absolute;
            inset: 72px 26px 0;
            border-radius: 56% 44% 0 0 / 34% 30% 0 0;
            background: #f29d6d;
        }

        .dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f6b27f;
            opacity: 0.85;
        }
        .d1 { left: 15.5%; top: 49%; width: 12px; height: 12px; }
        .d2 { left: 16.3%; top: 42%; width: 40px; height: 40px; border-radius: 12px; opacity: 0.45; }
        .d3 { left: 82%; top: 67%; width: 18px; height: 18px; }
        .d4 { right: 4.5%; top: 68.5%; width: 36px; height: 36px; opacity: 0.5; }

        .container {
            position: relative;
            z-index: 1;
            width: min(420px, calc(100% - 32px));
            text-align: center;
        }

        .title {
            margin: 0 0 26px;
            font-size: clamp(54px, 6.2vw, 66px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .error {
            margin: 0 0 12px;
            font-size: 14px;
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            padding: 8px 10px;
            text-align: left;
        }

        .field {
            margin: 0 0 14px;
            text-align: left;
        }

        .label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.06em;
            font-weight: 700;
        }

        .input {
            width: 100%;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 33px;
            line-height: 1.1;
            color: #3a2f2a;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input:focus {
            border-color: #e49d6d;
            box-shadow: 0 0 0 4px rgba(244, 157, 108, 0.18);
        }

        .submit {
            width: 100%;
            border: 0;
            border-radius: 20px;
            background: var(--btn);
            color: #fff;
            font-size: 40px;
            font-weight: 700;
            padding: 14px 16px;
            margin-top: 6px;
            cursor: pointer;
            transition: filter 0.2s ease, transform 0.08s ease;
            box-shadow: 0 3px 0 rgba(206, 88, 47, 0.35);
        }

        .submit:hover { background: var(--btn-hover); filter: brightness(1.02); }
        .submit:active { transform: translateY(1px); }

        .foot {
            margin: 14px 0 0;
            color: #6f6155;
            font-size: 17px;
        }

        @media (max-width: 640px) {
            .title { margin-bottom: 18px; font-size: 44px; }
            .input { font-size: 16px; padding: 12px 14px; }
            .submit { font-size: 22px; padding: 12px; }
            .foot { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="layer" aria-hidden="true">
        <div class="wave-left"></div>
        <div class="wave-right"></div>
        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>
    </div>

    <main class="container">
        <h1 class="title">Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="label">ユーザー名</label>
                <input class="input" type="text" name="username" placeholder="Login" required>
            </div>
            <div class="field">
                <label class="label">パスワード</label>
                <input class="input" type="password" name="password" placeholder="Password" required>
            </div>
            <button class="submit" type="submit">Login</button>
        </form>

        <p class="foot">Closed Care</p>
    </main>
</body>
</html>
