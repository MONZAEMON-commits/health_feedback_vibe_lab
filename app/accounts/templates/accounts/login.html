<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>
    <style>
        :root {
            --bg1: #fff6fb;
            --bg2: #eef8ff;
            --card: #ffffff;
            --text: #303640;
            --muted: #657080;
            --primary: #4c8bf5;
            --primary-hover: #3f79da;
            --error: #c63d5f;
            --ring: #dce8ff;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            font-family: "Yu Gothic UI", "Meiryo", sans-serif;
            color: var(--text);
            background:
                radial-gradient(1000px 500px at 10% -10%, #ffd9ec 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 100%, #d8efff 0%, transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            padding: 24px;
        }
        .card {
            width: min(420px, 100%);
            background: var(--card);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(70, 95, 145, 0.16);
            padding: 26px 24px 22px;
            border: 1px solid #f0f4ff;
        }
        .title {
            margin: 2px 0 4px;
            font-size: 34px;
            font-weight: 700;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 18px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        .field {
            margin-bottom: 14px;
        }
        .label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--muted);
        }
        .input {
            width: 100%;
            border: 1px solid #d9e2f7;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }
        .error {
            margin: 0 0 12px;
            font-size: 14px;
            color: var(--error);
            background: #fff1f5;
            border: 1px solid #ffd7e4;
            border-radius: 10px;
            padding: 8px 10px;
        }
        .submit {
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 11px 14px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.08s ease;
        }
        .submit:hover {
            background: var(--primary-hover);
        }
        .submit:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="title">ログイン</h1>
        <p class="subtitle">体調管理システム</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="label">ユーザー名</label>
                <input class="input" type="text" name="username" required>
            </div>
            <div class="field">
                <label class="label">パスワード</label>
                <input class="input" type="password" name="password" required>
            </div>
            <button class="submit" type="submit">ログイン</button>
        </form>
    </main>
</body>
</html>
