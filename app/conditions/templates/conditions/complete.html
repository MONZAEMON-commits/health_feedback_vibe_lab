<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>入力完了</title>
    <style>
        :root {
            --bg1: #fff8fc;
            --bg2: #eef8ff;
            --card: #ffffff;
            --text: #243243;
            --muted: #5f6f86;
            --line: #e1e9f8;
            --ok: #19a163;
            --btn: #3f86f4;
            --btn-hover: #2f75e2;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            font-family: "Yu Gothic UI", "Meiryo", sans-serif;
            color: var(--text);
            background:
                radial-gradient(860px 420px at 0% 0%, #ffdce9 0%, transparent 55%),
                radial-gradient(860px 420px at 100% 100%, #dff2ff 0%, transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            padding: 20px;
        }
        .card {
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 14px 28px rgba(38, 74, 131, 0.14);
            padding: 22px 18px;
            text-align: center;
        }
        .emoji {
            font-size: 48px;
            margin: 0 0 4px;
        }
        .title {
            margin: 0 0 8px;
            font-size: clamp(30px, 4vw, 48px);
            letter-spacing: 0.4px;
        }
        .message {
            margin: 0 0 12px;
            font-size: clamp(20px, 2.6vw, 32px);
            font-weight: 700;
            color: var(--ok);
        }
        .note {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 14px;
        }
        .count {
            font-weight: 700;
            color: #1f4f96;
        }
        .btn {
            border: 0;
            border-radius: 12px;
            background: var(--btn);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 10px 16px;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--btn-hover);
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="emoji">🌸</p>
        <h1 class="title">入力完了</h1>
        <p class="message">体調入力を登録しました。</p>
        <p class="note">この画面は <span id="countdown" class="count">10</span> 秒後に自動でログアウトします。</p>
        <a class="btn" href="{% url 'accounts:logout' %}">すぐにログアウト</a>
    </main>
<script>
        var left = 10;
        var node = document.getElementById("countdown");
        var timer = setInterval(function () {
            left -= 1;
            if (left < 0) {
                clearInterval(timer);
                return;
            }
            node.textContent = String(left);
        }, 1000);

        setTimeout(function () {
            window.location.href = "{% url 'accounts:logout' %}";
        }, 10000);
    </script>
</body>
</html>
