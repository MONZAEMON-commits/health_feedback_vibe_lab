<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>体調入力</title>
    {% load static %}
    <style>
        :root {
            --bg: #fff7eb;
            --text: #4a3a2a;
            --blue: #2b5da8;
            --cyan: #26aac6;
            --green: #49a934;
            --orange: #df8d1a;
            --pink: #d74f90;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            background:
                radial-gradient(900px 420px at 0% -10%, #fff3de 0%, transparent 60%),
                radial-gradient(900px 420px at 100% 100%, #f3dfc1 0%, transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px 20px 84px;
            text-align: center;
        }
        h2 {
            font-size: clamp(34px, 3.6vw, 62px);
            margin: 6px 0 14px;
            letter-spacing: 1px;
        }
        .section-title {
            font-size: clamp(34px, 3.4vw, 58px);
            margin: 18px 0 14px;
            font-weight: 700;
        }
        .score-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(100px, 1fr));
            gap: 8px;
            justify-items: center;
        }
        .score input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .score-label {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
        }
        .score-label.is-disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .score input[type="radio"]:checked + .score-label {
            background: rgba(255, 250, 242, 0.96);
            box-shadow: 0 0 0 2px #8a6a45 inset;
        }
        .icon-img {
            width: clamp(58px, 5.6vw, 86px);
            height: clamp(58px, 5.6vw, 86px);
            object-fit: contain;
            transform-origin: center;
            transition: transform 180ms ease;
        }
        .score-label.is-active .icon-img {
            transform: scale(1.08);
        }
        .score-label.is-tap .icon-img {
            animation: pop 340ms ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            35% { transform: scale(1.2) rotate(-3deg); }
            70% { transform: scale(0.95) rotate(2deg); }
            100% { transform: scale(1.08); }
        }
        .label {
            font-size: clamp(22px, 2.4vw, 50px);
            font-weight: 600;
            line-height: 1.1;
        }
        .legend {
            font-size: 42px;
        }
        .error-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
            color: #bb2222;
            font-size: 16px;
        }
        .actions {
            margin-top: 14px;
        }
        .actions button {
            font-size: clamp(24px, 2.2vw, 40px);
            padding: 6px 18px;
            cursor: pointer;
        }
        .absent {
            margin-top: 10px;
            font-size: clamp(14px, 1.2vw, 18px);
        }
        .opinion-btn {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: inline-block;
            padding: 12px 22px;
            border-radius: 12px;
            background: #c77945;
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(18px, 1.8vw, 28px);
            font-weight: 700;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .logout-form {
            position: fixed;
            top: 18px;
            right: 24px;
            margin: 0;
        }
        .logout-btn {
            border: 1px solid #d8bf9c;
            background: #fffaf1;
            color: #5a4632;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
        }
        @media (max-width: 820px) {
            .wrap { padding: 12px 12px 76px; }
            h2, .section-title { margin: 4px 0 10px; }
            .score-row { grid-template-columns: repeat(5, minmax(58px, 1fr)); gap: 4px; }
            .score-label { padding: 4px 4px; }
            .icon-img { width: 64px; height: 64px; }
            .label { font-size: 28px; }
            .actions button { font-size: 32px; }
            .actions { margin-top: 8px; }
            .logout-btn { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
    {% if form.non_field_errors %}
        <ul class="error-list">
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <h2>体調</h2>
        <div class="score-row">
            <div class="score">
                <input id="physical_1" type="radio" name="physical" value="1" {% if form.data.physical == "1" %}checked{% endif %}>
                <label for="physical_1" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/physical_1.png' %}" alt="体調1">
                    <span class="label">悪い</span>
                </label>
            </div>
            <div class="score">
                <input id="physical_2" type="radio" name="physical" value="2" {% if form.data.physical == "2" %}checked{% endif %}>
                <label for="physical_2" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/physical_2.png' %}" alt="体調2">
                    <span class="label">不調</span>
                </label>
            </div>
            <div class="score">
                <input id="physical_3" type="radio" name="physical" value="3" {% if form.data.physical == "3" %}checked{% endif %}>
                <label for="physical_3" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/physical_3.png' %}" alt="体調3">
                    <span class="label">普通</span>
                </label>
            </div>
            <div class="score">
                <input id="physical_4" type="radio" name="physical" value="4" {% if form.data.physical == "4" %}checked{% endif %}>
                <label for="physical_4" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/physical_4.png' %}" alt="体調4">
                    <span class="label">好調</span>
                </label>
            </div>
            <div class="score">
                <input id="physical_5" type="radio" name="physical" value="5" {% if form.data.physical == "5" %}checked{% endif %}>
                <label for="physical_5" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/physical_5.png' %}" alt="体調5">
                    <span class="label">絶好調</span>
                </label>
            </div>
        </div>

        <h2 class="section-title">メンタル</h2>
        <div class="score-row">
            <div class="score">
                <input id="mental_1" type="radio" name="mental" value="1" {% if form.data.mental == "1" %}checked{% endif %}>
                <label for="mental_1" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/mental_1.png' %}" alt="メンタル1">
                    <span class="label">悪い</span>
                </label>
            </div>
            <div class="score">
                <input id="mental_2" type="radio" name="mental" value="2" {% if form.data.mental == "2" %}checked{% endif %}>
                <label for="mental_2" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/mental_2.png' %}" alt="メンタル2">
                    <span class="label">良くない</span>
                </label>
            </div>
            <div class="score">
                <input id="mental_3" type="radio" name="mental" value="3" {% if form.data.mental == "3" %}checked{% endif %}>
                <label for="mental_3" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/mental_3.png' %}" alt="メンタル3">
                    <span class="label">普通</span>
                </label>
            </div>
            <div class="score">
                <input id="mental_4" type="radio" name="mental" value="4" {% if form.data.mental == "4" %}checked{% endif %}>
                <label for="mental_4" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/mental_4.png' %}" alt="メンタル4">
                    <span class="label">良い</span>
                </label>
            </div>
            <div class="score">
                <input id="mental_5" type="radio" name="mental" value="5" {% if form.data.mental == "5" %}checked{% endif %}>
                <label for="mental_5" class="score-label">
                    <img class="icon-img" src="{% static 'img/conditions/mental_5.png' %}" alt="メンタル5">
                    <span class="label">とても良い</span>
                </label>
            </div>
        </div>

        <div class="actions">
            <button type="submit">確定</button>
        </div>

        <div class="absent">
            <label><input type="checkbox" name="is_absent" value="on" {% if form.data.is_absent %}checked{% endif %}> 休みの場合はこちらを選択</label>
        </div>
    </form>
    </div>
    <a class="logout-form logout-btn" href="{% url 'accounts:logout' %}">ログアウト</a>
    <a class="opinion-btn" href="http://127.0.0.1:8080/index.php?id={{ request.user.id }}&return_to={{ request.scheme|add:'://'|add:request.get_host|add:'/login/'|urlencode }}">ご意見箱</a>
    <script src="{% static 'js/conditions_input.js' %}"></script>
</body>
</html>
