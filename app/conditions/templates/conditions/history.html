<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>体調履歴</title>
</head>
<body>
    <h1>体調履歴</h1>
    <table border="1">
        <thead>
            <tr>
                <th>日付</th>
                <th>肉体</th>
                <th>精神</th>
                <th>休み</th>
            </tr>
        </thead>
        <tbody>
            {% for condition in conditions %}
                <tr>
                    <td>{{ condition.date }}</td>
                    <td>{{ condition.physical|default:"-" }}</td>
                    <td>{{ condition.mental|default:"-" }}</td>
                    <td>{{ condition.is_absent|yesno:"はい,いいえ" }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">データがありません。</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
